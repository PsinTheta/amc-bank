spring.application.name=amc-bank-day9-final
server.port=8080

# ==============================================================================
# DEFAULT DATABASE: H2 IN-MEMORY (Runs immediately anywhere with zero setup)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:amc_bank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================================
# POSTGRESQL CONFIGURATION (Uncomment below if you wish to use PostgreSQL)
# ==============================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/amc_bank
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_POSTGRES_PASSWORD

# JWT Secret: 1 hour expiration
app.jwt.secret=${JWT_SECRET:AMC-Bank-Classroom-JWT-Secret-Key-2026-Change-In-Production}
app.jwt.expiration-ms=3600000
